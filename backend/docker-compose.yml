version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sa-club-de-leones-db
    environment:
      POSTGRES_DB: SA_ClubDeLeones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SA_ClubDeLeones"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: